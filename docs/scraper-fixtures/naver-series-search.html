<script type="text/template" id="searchTemplate">
	<li class="lst">
		{if 'novel' == 'novel'}<a href="{=productURL}" onclick="nclk(this, 'nov.item','{=productNo}', '{=index}');">{/if}

			<div class="thmb_list_box">

</script>
